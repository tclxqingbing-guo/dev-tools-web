[project]
name = "bx-tools-agent-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai==2.37.0",
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "pillow>=11.0",
  "pytesseract>=0.3.13",
  "docker>=7.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.26"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
